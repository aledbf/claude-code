# Listen on localhost only, on the port specified in the firewall script
listen-address 127.0.0.1:31265

# Increase the maximum number of client connections
max-client-connections 1024

# Use the whitelist file located in the same directory
confdir /etc/privoxy
actionsfile whitelist.txt

# Allow Privoxy to handle requests redirected via NAT
accept-intercepted-requests 1

# Disable toggling (Ctrl-Alt-T in browser) - not relevant for server use
enable-remote-toggle 0
# Disable editing of actions via browser - security measure
enable-remote-http-toggle 0

# Log settings
logdir /var/log
logfile privoxy.log

# Debug settings (comment out for production)
debug 1
# debug 64
# debug 1024
# debug 4096
# debug 8192

# Access control
# permit-access 127.0.0.1
